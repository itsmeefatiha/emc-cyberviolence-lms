services:
  db:
    image: postgres:16-alpine
    container_name: emc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emc_lms_db}
      POSTGRES_USER: ${POSTGRES_USER:-emc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emc_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emc} -d ${POSTGRES_DB:-emc_lms_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: emc-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-True}
      POSTGRES_DB: ${POSTGRES_DB:-emc_lms_db}
      POSTGRES_USER: ${POSTGRES_USER:-emc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emc_secret}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_FRONTEND_DOMAIN: ${EMAIL_FRONTEND_DOMAIN:-localhost:8080}
      EMAIL_FRONTEND_PROTOCOL: ${EMAIL_FRONTEND_PROTOCOL:-http}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      USE_X_FORWARDED_HOST: "True"
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@emc.local}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-AdminPass123!}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/docs/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: emc-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - media:/usr/share/nginx/media:ro
      - staticfiles:/usr/share/nginx/static:ro

volumes:
  postgres_data:
  media:
  staticfiles:
