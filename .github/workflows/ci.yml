name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend - Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: emc_lms_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-test-secret-key
      TESTING: 'True'
      POSTGRES_DB: emc_lms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt flake8

      - name: Lint avec flake8
        run: >
          flake8 . --count --select=E9,F63,F7,F82
          --show-source --statistics
          --exclude=migrations,venv,.venv,__pycache__

      - name: Lancer les tests avec couverture
        run: pytest --cov-report=xml --cov-report=term-missing

      - name: Scan sécurité Bandit
        run: |
          pip install bandit==1.8.6
          bandit -c ../nft/bandit.yaml -r apps --severity-level medium -f txt -o bandit-report.txt

      - name: Uploader le rapport Bandit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.txt
          if-no-files-found: ignore

      - name: Uploader le rapport de couverture backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend - Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            nft/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint avec ESLint
        run: npm run lint

      - name: Lancer les tests avec couverture
        run: npm run test -- --coverage

      - name: Uploader le rapport de couverture frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error

      - name: Construire le frontend pour Lighthouse
        run: npm run build

      - name: Installer Chrome
        uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Installer Lighthouse CI
        working-directory: ./nft
        run: npm ci

      - name: Audit accessibilité Lighthouse
        working-directory: ./nft
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run lighthouse

      - name: Uploader le rapport Lighthouse
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: nft/lhci-report
          if-no-files-found: ignore

  e2e:
    name: E2E - Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: emc_lms_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      PYTHON: python
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-e2e-secret-key
      DEBUG: 'True'
      POSTGRES_DB: emc_lms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances Django
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Appliquer les migrations
        working-directory: ./backend
        run: python manage.py migrate --noinput

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Installer les dépendances frontend
        working-directory: ./frontend
        run: npm ci

      - name: Installer les dépendances E2E
        working-directory: ./e2e
        run: npm ci

      - name: Installer Chromium pour Playwright
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests E2E
        working-directory: ./e2e
        run: npm test

      - name: Uploader le rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  performance:
    name: Performance - Locust
    runs-on: ubuntu-latest
    needs: [backend]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: emc_lms_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-nft-secret-key
      DEBUG: 'True'
      POSTGRES_DB: emc_lms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            nft/requirements.txt

      - name: Installer Django et Locust
        run: |
          pip install -r backend/requirements.txt
          pip install -r nft/requirements.txt

      - name: Appliquer les migrations et le seed E2E
        working-directory: ./backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_e2e

      - name: Démarrer l’API Django
        working-directory: ./backend
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 > django-nft.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/docs/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Django n’a pas démarré à temps"
          cat django-nft.log
          exit 1

      - name: Lancer Locust (charge basique)
        working-directory: ./nft
        run: |
          mkdir -p reports
          locust -f locustfile.py --headless -u 8 -r 4 -t 30s \
            --host http://127.0.0.1:8000 \
            --html reports/locust.html \
            --csv reports/locust \
            --exit-code-on-error 1

      - name: Uploader le rapport Locust
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: locust-report
          path: nft/reports
          if-no-files-found: ignore

